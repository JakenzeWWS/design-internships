name: Update vacancies

on:
  schedule:
    - cron: "17 * * * *"   # every hour
  workflow_dispatch:        # "Run workflow" button
  push:
    paths:
      - "data/manual.json"
      - "scripts/fetch.mjs"

permissions:
  contents: write

concurrency:
  group: update-vacancies
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch vacancies
        env:
          HH_APP_TOKEN: ${{ secrets.HH_APP_TOKEN }}
          HH_CLIENT_ID: ${{ secrets.HH_CLIENT_ID }}
          HH_CLIENT_SECRET: ${{ secrets.HH_CLIENT_SECRET }}
          HH_USER_AGENT: ${{ secrets.HH_USER_AGENT }}
        run: node scripts/fetch.mjs
      - name: Commit if changed
        run: |
          git config user.name "vacancy-bot"
          git config user.email "vacancy-bot@users.noreply.github.com"
          git add data/vacancies.json
          git diff --cached --quiet || (git commit -m "Update vacancies" && git push)
